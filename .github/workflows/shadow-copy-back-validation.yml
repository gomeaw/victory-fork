name: Shadow copy-back validation
on:
  push:
    branches: [validation/shadow-copy-back-413bab7]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - name: CPU and Rust version
        run: |
          (Get-CimInstance Win32_Processor).Name
          rustc --version --verbose
      - name: Run fixed-input A/B benchmark
        run: |
          rustc --edition=2024 -O .github/shadow-copy-back-bench.rs -o shadow-copy-back-bench.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          1..3 | ForEach-Object {
            ./shadow-copy-back-bench.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
